# Cloud Run deployment (backend + frontend). Set PROJECT_ID first.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, gcr.io/$PROJECT_ID/jansetu-backend, ./backend]
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/jansetu-backend]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run deploy jansetu-backend
      - --image=gcr.io/$PROJECT_ID/jansetu-backend
      - --platform=managed --region=asia-south1 --allow-unauthenticated
      - --port=8000
      - --set-env-vars=GEMINI_API_KEY=$_GEMINI_API_KEY,DATABASE_URL=$_DATABASE_URL,CORS_ORIGINS=$_CORS_ORIGINS,GOOGLE_APPLICATION_CREDENTIALS=$_GCP_SA_KEY_PATH,GCS_BUCKET=$_GCS_BUCKET
  - name: gcr.io/cloud-builders/docker
    # NEXT_PUBLIC_* vars bake into the static bundle at build time, so the
    # backend URL must be known here. Deploy order: (1) submit with
    # _PHASE=backend, (2) read the backend URL, (3) submit with
    # _PHASE=frontend _API_URL=<backend-url> _CORS_ORIGINS=<frontend-url>,
    # (4) update the backend CORS to the frontend URL (one command in deploy.sh).
    args: [build, --build-arg, NEXT_PUBLIC_API_URL=$_API_URL, --build-arg, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$_MAPS_KEY, -t, gcr.io/$PROJECT_ID/jansetu-frontend, ./frontend]
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/jansetu-frontend]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run deploy jansetu-frontend
      - --image=gcr.io/$PROJECT_ID/jansetu-frontend
      - --platform=managed --region=asia-south1 --allow-unauthenticated
      - --port=3000
      - --set-env-vars=NEXT_PUBLIC_API_URL=$_API_URL,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$_MAPS_KEY
substitutions:
  _GEMINI_API_KEY: ""
  _DATABASE_URL: ""
  _API_URL: ""
  _CORS_ORIGINS: "https://jansetu-frontend-xxxxxxxxxx-as.a.run.app"
  _GCP_SA_KEY_PATH: ""
  _GCS_BUCKET: ""
  _MAPS_KEY: ""
